name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 21
      uses: actions/setup-java@v1
      with:
        java-version: 21
    - name: Build with Gradle
      run: ./gradlew check
      env:
        METAFACTURE_INTEGRATION_TEST_LOG_PASSED: true
